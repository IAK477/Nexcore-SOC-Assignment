title: Suspicious Access to LSASS Process
id: nexcore-002-lsass-access
status: experimental
description: Detects processes accessing the Windows LSASS process, which may indicate credential access activity.
author: Ahmed Kazi
date: 2026/10/05

logsource:
    category: process_access
    product: windows

detection:
    selection:
        TargetImage|endswith:
            - '\lsass.exe'

    condition: selection

falsepositives:
    - Legitimate security software
    - Endpoint detection and response tools
    - Authorized system administration
    - Security testing activities

level: high

tags:
    - attack.credential_access
    - attack.t1003